
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three Question Quiz</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #eef2ff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}

.quiz-container {
    background: white;
    padding: 30px;
    width: 90%;
    max-width: 500px;
    border-radius: 12px;
    box-shadow: 0 5px 20px #0002;
}

h1 {
    text-align: center;
    color: #3730a3;
}

.question {
    margin: 20px 0;
    font-weight: bold;
}

label {
    display: block;
    padding: 10px;
    margin: 6px 0;
    background: #f1f5f9;
    border-radius: 6px;
    cursor: pointer;
}

button {
    width: 100%;
    padding: 12px;
    background: #4f46e5;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
    margin-top: 15px;
}

button:hover {
    background: #3730a3;
}

#result {
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    margin-top: 20px;
}

.hidden {
    display: none;
}
</style>
</head>

<body>

<div class="quiz-container">

<h1>Three Question Quiz</h1>

<form id="quizForm">

<div class="question">
<p>1. What is the capital of India?</p>
<label><input type="radio" name="q1" value="a"> Mumbai</label>
<label><input type="radio" name="q1" value="b"> New Delhi</label>
<label><input type="radio" name="q1" value="c"> Chennai</label>
</div>

<div class="question">
<p>2. Which language is used to structure web pages?</p>
<label><input type="radio" name="q2" value="a"> HTML</label>
<label><input type="radio" name="q2" value="b"> Python</label>
<label><input type="radio" name="q2" value="c"> Java</label>
</div>

<div class="question">
<p>3. What is 5 + 5?</p>
<label><input type="radio" name="q3" value="a"> 15</label>
<label><input type="radio" name="q3" value="b"> 8</label>
<label><input type="radio" name="q3" value="c"> 10</label>
</div>

<button type="submit">Submit Quiz</button>

</form>

<div id="result" class="hidden"></div>

<button id="restart" class="hidden"
onclick="restartQuiz()">Try Again</button>

</div>

<script>
const correctAnswers = {
    q1: "b",
    q2: "a",
    q3: "c"
};

document.getElementById("quizForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    let score = 0;

    for (let question in correctAnswers) {
        let selected = document.querySelector(
            'input[name="' + question + '"]:checked'
        );

        if (selected && selected.value === correctAnswers[question]) {
            score++;
        }
    }

    let percentage = (score / 3) * 100;

    document.getElementById("quizForm").classList.add("hidden");

    let result = document.getElementById("result");
    result.classList.remove("hidden");

    result.innerHTML =
        "Quiz Completed!<br><br>" +
        "Your Score: " + score + " / 3<br>" +
        "Percentage: " + percentage.toFixed(1) + "%<br><br>" +
        (score === 3 ? "Excellent! All answers are correct!" :
         score >= 2 ? "Good job! Keep practicing!" :
         "Keep learning and try again!");

    document.getElementById("restart").classList.remove("hidden");
});

function restartQuiz() {
    document.getElementById("quizForm").reset();

    document.getElementById("quizForm").classList.remove("hidden");
    document.getElementById("result").classList.add("hidden");
    document.getElementById("restart").classList.add("hidden");
}
</script>

</body>
</html>
